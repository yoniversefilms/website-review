<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Client Review Portal</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2c; --panel2:#1c2534; --line:#26324a;
    --ink:#e7ecf5; --dim:#93a0b8; --accent:#4f8cff; --accent2:#7c5cff;
    --ok:#3ecf8e; --warn:#f5b445; --r:14px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:34px 18px 80px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  /* login card */
  .gate{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;max-width:400px;margin:8vh auto 0;text-align:center}
  .gate h2{font-size:17px;margin:0 0 6px}
  .gate p{color:var(--dim);font-size:13px;margin:0 0 18px}
  .gate input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;font:15px var(--sans);text-align:center;letter-spacing:.2em}
  .gate button{width:100%;margin-top:10px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;font:600 14px var(--sans);cursor:pointer}
  .gate .err{color:#ff6b6b;font-size:12.5px;margin-top:10px;min-height:16px}
  /* asset cards */
  .card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px}
  .kicon{width:40px;height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 40px}
  .cmain{min-width:0;flex:1}
  .ct{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cm{color:var(--dim);font-size:12px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .badge{border-radius:999px;padding:2px 9px;font:600 10.5px/1.6 var(--sans)}
  .badge.review{background:rgba(245,180,69,.14);color:var(--warn)}
  .badge.approved{background:rgba(62,207,142,.13);color:var(--ok)}
  .badge.archived{background:var(--panel2);color:var(--dim)}
  .go{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 13px var(--sans);cursor:pointer;text-decoration:none;flex:0 0 auto}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--dim);line-height:1.7}
  .foot{margin-top:30px;color:#55627a;font-size:12px;text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="gate" id="gate">
    <h2 id="gname">Client Review</h2>
    <p>Enter the review password you received from the studio.</p>
    <input id="pw" type="password" placeholder="password" autocomplete="off" />
    <button id="enter">Enter →</button>
    <div class="err" id="err"></div>
  </div>

  <div id="dash" class="hidden">
    <header>
      <div class="logo">◑</div>
      <div>
        <h1 id="dname">Your review portal</h1>
        <div class="sub">Tap “Review” on any item — pin 📍 or draw ✎ right on it, add photos, and we get to work.</div>
      </div>
    </header>
    <div id="list"></div>
    <p class="foot">Powered by Pixeldust · your notes go straight to the studio</p>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var C = window.WR_CONFIG || {};
  var REST = (C.supabaseUrl || "").replace(/\/$/, "") + "/rest/v1";
  var q = new URLSearchParams(location.search);
  var CK = (q.get("c") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "");
  var AUTH_KEY = "wrportal:" + CK;
  var PROOF_BASE = location.origin + location.pathname.replace(/[^/]*$/, "") + "proof.html";
  var $ = function(s){ return document.querySelector(s); };
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
  function hdr(key){ return { apikey:C.supabaseAnon, Authorization:"Bearer "+C.supabaseAnon, "x-board-key":key }; }
  function api(key, path){ return fetch(REST+path,{headers:hdr(key)}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }

  if (!CK) { $("#gname").textContent = "Missing portal link"; $("#pw").disabled = true; $("#enter").disabled = true;
    $("#err").textContent = "This link is missing its client id — ask the studio for a fresh one."; return; }

  // client name on the gate (nice touch, works pre-login — the link itself carries the key)
  api(CK, "/clients?client_key=eq."+encodeURIComponent(CK)+"&select=name").then(function(rows){
    if(rows[0]) { $("#gname").textContent = rows[0].name + " — review portal"; $("#dname").textContent = rows[0].name; }
  }).catch(function(){});

  function authed(){ try{ return localStorage.getItem(AUTH_KEY)==="1"; }catch(e){ return false; } }
  function unlock(){
    // Courtesy gate, not security: keeps honest people out of each other's portals.
    var v = ($("#pw").value||"").trim().toLowerCase();
    if (v !== "pds") { $("#err").textContent = "That's not it — check the password from the studio."; $("#pw").value=""; $("#pw").focus(); return; }
    try{ localStorage.setItem(AUTH_KEY,"1"); }catch(e){}
    show();
  }
  $("#enter").addEventListener("click", unlock);
  $("#pw").addEventListener("keydown", function(e){ if(e.key==="Enter") unlock(); });

  function kindIcon(k){ return k==="pdf"?"📄":k==="image"?"🖼":k==="deck"?"📊":k==="website"?"🌐":k==="doc"?"📝":"📦"; }
  function reviewLink(d){
    if (d.kind==="website" && d.src) return d.src + (d.src.indexOf("?")>=0?"&":"?") + "review=1";
    return PROOF_BASE + "?review=1&board=" + encodeURIComponent(d.board) + "&src=" + encodeURIComponent(d.src||"") + "&title=" + encodeURIComponent(d.title) + (d.kind==="pdf"?"&kind=pdf":"");
  }
  function ago(iso){ if(!iso) return ""; var s=(Date.now()-new Date(iso).getTime())/1000;
    if(s<3600) return Math.max(1,Math.round(s/60))+"m ago"; if(s<86400) return Math.round(s/3600)+"h ago";
    if(s<86400*30) return Math.round(s/86400)+"d ago"; return new Date(iso).toLocaleDateString(); }

  function load(){
    api(CK, "/deliverables?client_key=eq."+encodeURIComponent(CK)+"&status=neq.archived&order=created_at.desc").then(function(rows){
      var list=$("#list"); list.innerHTML="";
      if(!rows.length){ list.appendChild(el("div","empty","Nothing to review just yet —\nyou'll get a ping when something's ready.")); return; }
      rows.forEach(function(d){
        var card=el("div","card");
        card.appendChild(el("div","kicon",kindIcon(d.kind)));
        var m=el("div","cmain");
        var t=el("div","ct",d.title); t.setAttribute("dir","auto"); m.appendChild(t);
        var meta=el("div","cm");
        var b=el("span","badge "+(d.status==="approved"?"approved":d.status==="archived"?"archived":"review"),
                 d.status==="approved"?"approved ✓":"awaiting your notes");
        meta.appendChild(b);
        meta.appendChild(el("span",null,ago(d.updated_at||d.created_at)));
        m.appendChild(meta); card.appendChild(m);
        var go=el("a","go","Review →"); go.href=reviewLink(d); go.target="_blank"; card.appendChild(go);
        list.appendChild(card);
      });
    }).catch(function(){ $("#list").innerHTML=""; $("#list").appendChild(el("div","empty","Couldn't load right now — try again in a minute.")); });
  }
  function show(){ $("#gate").classList.add("hidden"); $("#dash").classList.remove("hidden"); load(); }

  if (authed()) show(); else setTimeout(function(){ try{ $("#pw").focus(); }catch(e){} }, 50);
  window.addEventListener("focus", function(){ if(authed()) load(); });
})();
</script>
</body>
</html>
