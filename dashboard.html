<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Review OS</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2c; --panel2:#1c2534; --line:#26324a;
    --ink:#e7ecf5; --dim:#93a0b8; --accent:#4f8cff; --accent2:#7c5cff;
    --ok:#3ecf8e; --warn:#f5b445; --danger:#ff6b6b; --sel:#ff8a1e;
    --r:14px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  button{font:600 13px/1 var(--sans);cursor:pointer;border:0;border-radius:10px}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 80px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px;margin:1px 0 0}
  .spacer{flex:1}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.4s ease infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{background:var(--accent);color:#fff;padding:10px 14px}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .addrow{display:flex;gap:8px;margin-bottom:16px}
  .addrow input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 13px;font:14px var(--sans)}
  .addrow input::placeholder{color:#5b6880}
  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 16px;font:600 13px/1 var(--sans);display:inline-flex;gap:8px;align-items:center}
  .tab .n{background:var(--panel2);border-radius:999px;padding:1px 8px;font-size:11px}
  .tab.on{background:#12233f;border-color:var(--accent);color:#dce7ff}
  .tab.on .n{background:rgba(79,140,255,.25);color:#cfe0ff}
  .tab.flagged.on{background:#3a1620;border-color:var(--danger);color:#ffd7d7}
  .chip{margin-left:auto;background:none;border:1px dashed var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;font:600 12px/1 var(--sans)}
  .chip.on{border-style:solid;border-color:var(--warn);color:var(--warn)}
  /* layout: list + drawer */
  .main{display:flex;gap:16px;align-items:flex-start}
  .list{flex:1;min-width:0}
  .group{margin-bottom:16px}
  .group-h{display:flex;align-items:center;gap:9px;padding:4px 2px 8px}
  .group-h .gname{font-weight:700;font-size:14px}
  .group-h .gact{margin-left:auto;display:flex;gap:6px}
  .mini{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;font:600 11.5px/1 var(--sans)}
  .mini.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mini.warn{background:rgba(245,180,69,.14);border-color:rgba(245,180,69,.4);color:var(--warn)}
  .mini.danger{color:var(--danger)}
  .mini.ok{background:rgba(62,207,142,.13);border-color:rgba(62,207,142,.4);color:var(--ok)}
  /* note rows */
  .row{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer}
  .row:hover{background:var(--panel2)}
  .row.sel{border-color:var(--sel);box-shadow:0 0 0 3px rgba(255,138,30,.18)}
  .num{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 11px/22px var(--sans);text-align:center}
  .row.done .num{background:var(--ok)}
  .row-main{min-width:0;flex:1}
  .row-body{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
  .row-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--dim);margin-top:3px}
  .tag{border-radius:999px;padding:1px 8px;font:600 10px/1.7 var(--sans);background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .tag.fix{background:rgba(245,180,69,.16);color:var(--warn)}
  .tag.flagged{background:rgba(255,107,107,.14);color:var(--danger)}
  .tag.done{background:rgba(62,207,142,.12);color:var(--ok)}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--dim);line-height:1.7}
  /* drawer */
  .drawer{width:400px;max-width:40vw;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  .drawer.hidden{display:none}
  .d-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .d-title{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .d-x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer}
  .d-sec{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px;font-size:13px}
  .d-sec .lbl{font:700 10px/1 var(--sans);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  .d-sec code{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
  .d-body{white-space:pre-wrap;font-size:14px;line-height:1.55}
  .d-quote{color:var(--dim);border-left:2px solid var(--line);padding-left:8px;margin-top:6px;font-size:12.5px}
  .photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .photos img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
  .d-warn{border-color:rgba(245,180,69,.5)} .d-warn .lbl{color:var(--warn)}
  .d-flag{border-color:rgba(255,107,107,.5)} .d-flag .lbl{color:var(--danger)}
  .d-ok{border-color:rgba(62,207,142,.5)} .d-ok .lbl{color:var(--ok)}
  .reply{background:var(--bg);border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:12.5px}
  .reply b{font-size:12px}
  .replyrow{display:flex;gap:6px;margin-top:8px}
  .replyrow input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px;font:13px var(--sans)}
  .d-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  /* deliverables panel */
  .dpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
  .dpanel-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .dpanel-h:hover{background:var(--panel2)}
  .dpanel-h .dim{color:var(--dim);font-weight:500;font-size:12px}
  .dl-form{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 12px;align-items:center}
  .dl-form input[type=text],.dl-form select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 10px;font:13px var(--sans)}
  .dl-form input[name=dtitle]{flex:1;min-width:150px}
  .dl-row{display:flex;gap:9px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13px}
  .dl-row .k{font-size:15px;flex:0 0 auto}
  .dl-row .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dl-row .c{color:var(--dim);font-size:11.5px}
  .dl-row .sp{flex:1}
  .dl-row select{background:var(--bg);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:4px 6px;font:600 11px var(--sans)}
  .foot{margin-top:26px;color:#55627a;font-size:12px;text-align:center}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:#0a0e17;color:var(--ink);
    border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:600 13px/1 var(--sans);transition:transform .2s ease;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #toast.show{transform:translateX(-50%) translateY(0)}
  @media (max-width:900px){
    .drawer{position:fixed;inset:auto 0 0 0;width:100%;max-width:100%;max-height:78vh;border-radius:16px 16px 0 0;z-index:50}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">◑</div>
    <div>
      <h1>Review OS</h1>
      <p class="sub">Feedback in · Claude fixes · you approve.</p>
    </div>
    <div class="spacer"></div>
    <span class="live"><span class="dot"></span><span id="liveTxt">live</span></span>
    <button class="btn ghost" id="refreshBtn">↻</button>
  </header>

  <div class="addrow">
    <input id="addInput" placeholder="Add a site under review — e.g. client-site.com" spellcheck="false" />
    <button class="btn" id="addBtn">Add site</button>
  </div>

  <div class="dpanel" id="dpanel">
    <div class="dpanel-h" id="dpanelH">📦 Deliverables <span class="dim" id="dCount"></span><span class="spacer"></span><span class="dim" id="dChev">show ▾</span></div>
    <div id="dBody" style="display:none">
      <div class="dl-form">
        <select id="dClient"></select>
        <input type="text" id="dTitle" name="dtitle" placeholder="Title — e.g. Brand board v2" />
        <select id="dKind">
          <option value="image">image</option><option value="pdf">pdf</option>
          <option value="deck">deck</option><option value="doc">doc</option>
          <option value="website">website</option><option value="other">other</option>
        </select>
        <input type="file" id="dFile" style="display:none" accept="image/*,application/pdf" />
        <button class="mini" id="dPick">📎 file</button>
        <input type="text" id="dSrc" placeholder="…or paste a URL" style="min-width:140px" />
        <button class="mini primary" id="dAdd">Add</button>
      </div>
      <div id="dlList"></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="main">
    <div class="list" id="list"></div>
    <div class="drawer hidden" id="drawer"></div>
  </div>

  <p class="foot">Boards keyed by domain · list lives in this browser · <a href="index.html">setup</a> · <a href="REVIEW-OS-PLAN.md">plan</a></p>
</div>
<div id="toast">Saved</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var C = window.WR_CONFIG || {};
  var REST = (C.supabaseUrl || "").replace(/\/$/, "") + "/rest/v1";
  var LSK = "wrdash:boards";
  var $ = function(s){ return document.querySelector(s); };
  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

  /* ---------- board list ---------- */
  function boards(){ try{ return JSON.parse(localStorage.getItem(LSK)||"[]"); }catch(e){ return []; } }
  function saveBoards(b){ try{ localStorage.setItem(LSK, JSON.stringify(b)); }catch(e){} }
  function norm(v){ v=String(v||"").trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,""); return v.split(/[\/?#]/)[0]; }
  (function(){
    var add = new URLSearchParams(location.search).get("add");
    if(!add) return;
    var b = boards();
    add.split(",").map(norm).filter(Boolean).forEach(function(d){ if(b.indexOf(d)<0) b.push(d); });
    saveBoards(b); history.replaceState(null,"",location.pathname);
  })();

  /* ---------- REST ---------- */
  function hdr(board){ return { apikey:C.supabaseAnon, Authorization:"Bearer "+C.supabaseAnon, "x-board-key":board, "Content-Type":"application/json" }; }
  function api(board, path){ return fetch(REST+path,{headers:hdr(board)}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
  function patch(board, id, body){
    body.updated_by = "Yonatan";
    return fetch(REST+"/notes?id=eq."+id, { method:"PATCH", headers:Object.assign(hdr(board),{Prefer:"return=minimal"}), body: JSON.stringify(body) })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); });
  }
  function postComment(board, noteId, body){
    return fetch(REST+"/comments", { method:"POST", headers:Object.assign(hdr(board),{Prefer:"return=minimal"}),
      body: JSON.stringify({ note_id:noteId, project_key:board, author:"Yonatan", author_id:"owner", body:body }) })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); });
  }
  function fetchBoard(board){
    return Promise.all([
      api(board, "/notes?project_key=eq."+encodeURIComponent(board)+"&order=created_at.asc&select=*"),
      api(board, "/comments?project_key=eq."+encodeURIComponent(board)+"&order=created_at.asc&select=note_id,author,body,created_at"),
      api(board, "/attachments?project_key=eq."+encodeURIComponent(board)+"&select=note_id,storage_path")
    ]).then(function(r){ return { board:board, notes:r[0]||[], comments:r[1]||[], atts:r[2]||[], error:null }; })
      .catch(function(e){ return { board:board, notes:[], comments:[], atts:[], error:e.message }; });
  }
  function attsOf(r, id){ return (r.atts||[]).filter(function(a){ return a.note_id===id; }); }
  function photoURL(p){ return (C.supabaseUrl||"").replace(/\/$/,"") + "/storage/v1/object/public/review-photos/" + p; }

  /* ---------- state machine ---------- */
  function tabOf(n){
    if (n.status !== "open") return "built";
    if (n.disposition === "parked") return "parked";
    if (n.disposition === "fix" && n.flag_reason) return "flagged";
    if (n.disposition === "fix") return "scheduled";
    return "under";
  }
  var TABS = [
    { key:"under",     label:"Under review" },
    { key:"scheduled", label:"Scheduled" },
    { key:"built",     label:"Built" },
    { key:"flagged",   label:"Flagged" },
  ];
  var activeTab = "under";
  var showParked = false;
  var selected = null;          // {board, id}
  var ALL = [];                 // [{board, notes, comments, error}]

  /* ---------- helpers ---------- */
  function layoutOf(n){ var w=n.viewport_w||0; return w ? (w<768?"📱":"💻") : ""; }
  function kindIcon(n){ return n.kind==="draw"?"✎":n.kind==="box"?"▭":n.kind==="text"?"🖍":"📍"; }
  function ago(iso){
    if(!iso) return "";
    var s=(Date.now()-new Date(iso).getTime())/1000;
    if(s<90) return "just now"; if(s<3600) return Math.round(s/60)+"m"; if(s<86400) return Math.round(s/3600)+"h";
    if(s<86400*30) return Math.round(s/86400)+"d"; return new Date(iso).toLocaleDateString();
  }
  function reviewLink(board, page){ var p = page && page!=="/" ? page : "/"; return "https://"+board+p+(p.indexOf("?")>=0?"&":"?")+"review=1"; }
  function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1800); }
  function numberOf(r, note){
    var sorted=r.notes.slice().sort(function(a,b){return (a.created_at||"")<(b.created_at||"")?-1:1;});
    return sorted.findIndex(function(x){return x.id===note.id;})+1;
  }
  function commentsOf(r, id){ return r.comments.filter(function(c){return c.note_id===id;}); }
  function claudePrompt(board){
    return 'Pull the latest review notes for '+board+' — in ~/Documents/"Website review" run: node sync.mjs '+board+
      ' — then read reviews/'+board+'/feedback.md. Work the 🔧 FIX QUEUE first, following my per-note instructions; notes with a '+
      '🚩 flag_reason are RETRIES — the previous attempt was rejected for that reason, address it specifically and set flag_reason '+
      'to null when you resolve. Propose fixes for untriaged OPEN notes but wait for my approval. SKIP ⏸ parked notes. Show me every '+
      'proposed edit BEFORE changing files. After I approve and you apply, set notes resolved (short resolution, clear disposition) '+
      'in feedback.json and run: node sync.mjs '+board+' --push';
  }
  function copy(text, msg){
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function(){ toast(msg||"Copied"); }).catch(function(){ window.prompt("Copy this:", text); });
  }

  /* ---------- deliverables (Build 2) ---------- */
  var CK = "wrdash:clients";
  function clientKeys(){ try{ var v=JSON.parse(localStorage.getItem(CK)||'null')||["lovedust","ruth"]; return v.length?v:["lovedust","ruth"]; }catch(e){ return ["lovedust","ruth"]; } }
  var DELIV = [];
  var PROOF_BASE = location.origin + location.pathname.replace(/[^/]*$/, "") + "proof.html";
  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "asset"; }
  function proofLink(d, owner){
    var u;
    if (d.kind === "website" && d.src) u = d.src + (d.src.indexOf("?")>=0?"&":"?") + "review=1";
    else u = PROOF_BASE + "?review=1&board=" + encodeURIComponent(d.board) + "&src=" + encodeURIComponent(d.src||"") + "&title=" + encodeURIComponent(d.title) + (d.kind==="pdf"?"&kind=pdf":"");
    return owner ? u + "&owner=1" : u;
  }
  function loadDeliv(){
    Promise.all(clientKeys().map(function(ck){
      return api(ck, "/deliverables?client_key=eq."+encodeURIComponent(ck)+"&order=created_at.desc")
        .then(function(rows){ return {ck:ck, rows:rows||[]}; })
        .catch(function(){ return {ck:ck, rows:[]}; });
    })).then(function(res){ DELIV=res; renderDeliv(); });
  }
  function kindIcon2(k){ return k==="pdf"?"📄":k==="image"?"🖼":k==="deck"?"📊":k==="website"?"🌐":k==="doc"?"📝":"📦"; }
  function renderDeliv(){
    var total=0; DELIV.forEach(function(g){ total+=g.rows.length; });
    $("#dCount").textContent = total ? "("+total+")" : "";
    var sel=$("#dClient"); var cur=sel.value; sel.innerHTML="";
    clientKeys().forEach(function(ck){ var o=document.createElement("option"); o.value=ck; o.textContent=ck; sel.appendChild(o); });
    if(cur) sel.value=cur;
    var list=$("#dlList"); list.innerHTML="";
    DELIV.forEach(function(g){
      g.rows.forEach(function(d){
        var row=el("div","dl-row");
        row.appendChild(el("span","k",kindIcon2(d.kind)));
        row.appendChild(el("span","t",d.title));
        row.appendChild(el("span","c",g.ck));
        row.appendChild(el("span","sp"));
        var st=document.createElement("select");
        ["under_review","approved","archived"].forEach(function(s){ var o=document.createElement("option"); o.value=s; o.textContent=s.replace("_"," "); if(d.status===s)o.selected=true; st.appendChild(o); });
        st.addEventListener("change",function(){
          fetch(REST+"/deliverables?id=eq."+d.id,{method:"PATCH",headers:Object.assign(hdr(g.ck),{Prefer:"return=minimal"}),body:JSON.stringify({status:st.value})})
            .then(function(r){ if(!r.ok) throw 0; toast("Status saved"); }).catch(function(){ toast("Failed"); });
        });
        row.appendChild(st);
        var op=el("a","mini","↗ proof"); op.href=proofLink(d,true); op.target="_blank"; op.style.textDecoration="none"; row.appendChild(op);
        var cp=el("button","mini","copy client link"); cp.addEventListener("click",function(){ copy(proofLink(d,false),"Client link copied"); }); row.appendChild(cp);
        list.appendChild(row);
      });
    });
    if(!total) list.appendChild(el("div","dl-row","No deliverables yet — add one above."));
  }
  $("#dpanelH").addEventListener("click",function(){
    var b=$("#dBody"); var open=b.style.display!=="none";
    b.style.display=open?"none":"block"; $("#dChev").textContent=open?"show ▾":"hide ▴";
    if(!open) loadDeliv();
  });
  var dPicked=null;
  $("#dPick").addEventListener("click",function(){ $("#dFile").click(); });
  $("#dFile").addEventListener("change",function(){ dPicked=$("#dFile").files[0]||null; $("#dPick").textContent=dPicked?("📎 "+dPicked.name.slice(0,14)):"📎 file"; });
  $("#dAdd").addEventListener("click",function(){
    var ck=$("#dClient").value, title=$("#dTitle").value.trim(), kind=$("#dKind").value, srcIn=$("#dSrc").value.trim();
    if(!ck||!title){ toast("Client + title required"); return; }
    var p;
    if(dPicked){
      var path=ck+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now())+"-"+dPicked.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      p=fetch((C.supabaseUrl||"").replace(/\/$/,"")+"/storage/v1/object/deliverables/"+path,{
        method:"POST",headers:{apikey:C.supabaseAnon,Authorization:"Bearer "+C.supabaseAnon,"x-board-key":ck,"Content-Type":dPicked.type||"application/octet-stream"},body:dPicked
      }).then(function(r){ if(!r.ok) throw new Error("upload HTTP "+r.status);
        return (C.supabaseUrl||"").replace(/\/$/,"")+"/storage/v1/object/public/deliverables/"+path; });
    } else if(srcIn){ p=Promise.resolve(srcIn); }
    else { toast("Attach a file or paste a URL"); return; }
    p.then(function(src){
      var board=ck+"-"+slug(title);
      return fetch(REST+"/deliverables",{method:"POST",headers:Object.assign(hdr(ck),{Prefer:"return=representation"}),
        body:JSON.stringify({client_key:ck,kind:kind,title:title,board:board,src:src})})
        .then(function(r){ if(!r.ok) throw new Error("insert HTTP "+r.status); return r.json(); })
        .then(function(rows){
          var b=boards(); if(b.indexOf(board)<0){ b.push(board); saveBoards(b); }
          $("#dTitle").value=""; $("#dSrc").value=""; dPicked=null; $("#dPick").textContent="📎 file"; $("#dFile").value="";
          copy(proofLink(rows[0],false),"Created — client proof link copied");
          loadDeliv(); load();
        });
    }).catch(function(e){ toast("Failed: "+(e.message||e)); });
  });

  /* ---------- render: tabs ---------- */
  function renderTabs(){
    var bar = $("#tabs"); bar.innerHTML = "";
    var counts = { under:0, scheduled:0, built:0, flagged:0, parked:0 };
    ALL.forEach(function(r){ r.notes.forEach(function(n){ counts[tabOf(n)]++; }); });
    TABS.forEach(function(t){
      var b = el("button","tab"+(t.key==="flagged"?" flagged":"")+(activeTab===t.key?" on":""));
      b.appendChild(el("span",null,t.label));
      b.appendChild(el("span","n",String(counts[t.key])));
      b.addEventListener("click",function(){ activeTab=t.key; showParked=false; selected=null; render(); });
      bar.appendChild(b);
    });
    var pk = el("button","chip"+(showParked?" on":""),"⏸ Parked ("+counts.parked+")");
    pk.addEventListener("click",function(){ showParked=!showParked; if(showParked){activeTab="parked";} else {activeTab="under";} selected=null; render(); });
    bar.appendChild(pk);
  }

  /* ---------- render: list ---------- */
  function renderList(){
    var wrap = $("#list"); wrap.innerHTML = "";
    var tab = showParked ? "parked" : activeTab;
    var any = false, anyBoards = false;
    ALL.forEach(function(r){
      anyBoards = true;
      var items = r.notes.filter(function(n){ return tabOf(n)===tab; })
        .sort(function(a,b){ return (a.updated_at||a.created_at||"") < (b.updated_at||b.created_at||"") ? 1 : -1; });
      if(r.error){
        var g0 = el("div","group"); var h0 = el("div","group-h");
        h0.appendChild(el("div","gname",r.board));
        h0.appendChild(el("div","mini danger","couldn't load: "+r.error)); g0.appendChild(h0); wrap.appendChild(g0);
        return;
      }
      if(!items.length) return;
      any = true;
      var g = el("div","group");
      var h = el("div","group-h");
      h.appendChild(el("div","gname",r.board));
      var acts = el("div","gact");
      var fx = el("button","mini primary","🤖 Fix with Claude");
      fx.addEventListener("click",function(){ copy(claudePrompt(r.board),"Prompt copied — paste it to Claude"); });
      acts.appendChild(fx);
      var op = el("a","mini","↗ open"); op.href = reviewLink(r.board,"/"); op.target="_blank"; op.style.textDecoration="none";
      acts.appendChild(op);
      h.appendChild(acts); g.appendChild(h);
      items.forEach(function(n){
        var row = el("div","row"+(n.status!=="open"?" done":"")+(selected && selected.id===n.id?" sel":""));
        row.appendChild(el("div","num",String(numberOf(r,n))));
        var main = el("div","row-main");
        var bd = el("div","row-body", n.body||"(no text)"); bd.setAttribute("dir","auto"); main.appendChild(bd);
        var meta = el("div","row-meta");
        meta.appendChild(el("span",null,kindIcon(n)+" "+(n.author||"?")));
        var lay=layoutOf(n); if(lay) meta.appendChild(el("span","tag",lay));
        if(n.section_id) meta.appendChild(el("span","tag","#"+n.section_id));
        if(n.owner_note) meta.appendChild(el("span","tag fix","🔧 instructed"));
        if(n.flag_reason) meta.appendChild(el("span","tag flagged","🚩 retry"));
        if(n.status!=="open") meta.appendChild(el("span","tag done",n.status));
        var nc = commentsOf(r,n.id).length; if(nc) meta.appendChild(el("span","tag","💬 "+nc));
        var np = attsOf(r,n.id).length; if(np) meta.appendChild(el("span","tag","📷 "+np));
        meta.appendChild(el("span",null,ago(n.updated_at||n.created_at)));
        main.appendChild(meta); row.appendChild(main);
        row.addEventListener("click",function(){ selected={board:r.board, id:n.id}; render(); });
        g.appendChild(row);
      });
      wrap.appendChild(g);
    });
    if(!anyBoards) wrap.appendChild(el("div","empty","No sites yet. Paste the review block into a site, then add its domain above."));
    else if(!any) wrap.appendChild(el("div","empty","Nothing in “"+(showParked?"Parked":TABS.filter(function(t){return t.key===activeTab;})[0].label)+"” right now."));
  }

  /* ---------- render: drawer ---------- */
  function findSelected(){
    if(!selected) return null;
    for(var i=0;i<ALL.length;i++){ if(ALL[i].board!==selected.board) continue;
      var n = ALL[i].notes.filter(function(x){return x.id===selected.id;})[0];
      if(n) return {r:ALL[i], n:n};
    }
    return null;
  }
  function renderDrawer(){
    var d = $("#drawer"); var hit = findSelected();
    if(!hit){ d.classList.add("hidden"); d.innerHTML=""; return; }
    var r=hit.r, n=hit.n, tab=tabOf(n);
    d.classList.remove("hidden"); d.innerHTML="";
    var head=el("div","d-head");
    head.appendChild(el("div","d-title","#"+numberOf(r,n)+" · "+r.board));
    var x=el("button","d-x","✕"); x.addEventListener("click",function(){ selected=null; render(); }); head.appendChild(x);
    d.appendChild(head);

    var whereSec=el("div","d-sec");
    whereSec.appendChild(el("div","lbl","Where"));
    var cd=el("code",null,n.target_selector||(n.section_id?"#"+n.section_id:n.page_url||"/")); whereSec.appendChild(cd);
    whereSec.appendChild(document.createTextNode("  "));
    var loc=el("a",null,"open at this spot →"); loc.href=reviewLink(r.board,n.page_url); loc.target="_blank"; whereSec.appendChild(loc);
    if(n.target_text){ var q=el("div","d-quote","“"+n.target_text+"”"); q.setAttribute("dir","auto"); whereSec.appendChild(q); }
    d.appendChild(whereSec);

    var noteSec=el("div","d-sec");
    noteSec.appendChild(el("div","lbl",(n.author||"?")+" · "+(layoutOf(n)||"")+" · "+ago(n.created_at)+" ago"));
    var body=el("div","d-body",n.body||"(no text)"); body.setAttribute("dir","auto"); noteSec.appendChild(body);
    var ph=attsOf(r,n.id);
    if(ph.length){
      var pg=el("div","photos");
      ph.forEach(function(a2){
        var im=document.createElement("img"); im.src=photoURL(a2.storage_path); im.loading="lazy";
        im.addEventListener("click",function(){ window.open(photoURL(a2.storage_path),"_blank"); });
        pg.appendChild(im);
      });
      noteSec.appendChild(pg);
    }
    d.appendChild(noteSec);

    if(n.owner_note){ var os=el("div","d-sec d-warn"); os.appendChild(el("div","lbl","🔧 Your instruction to Claude"));
      var ob=el("div","d-body",n.owner_note); ob.setAttribute("dir","auto"); os.appendChild(ob); d.appendChild(os); }
    if(n.flag_reason){ var fs=el("div","d-sec d-flag"); fs.appendChild(el("div","lbl","🚩 Flagged — retry because"));
      var fb=el("div","d-body",n.flag_reason); fb.setAttribute("dir","auto"); fs.appendChild(fb); d.appendChild(fs); }
    if(n.resolution){ var rs=el("div","d-sec d-ok"); rs.appendChild(el("div","lbl","✓ Claude's resolution"));
      var rb=el("div","d-body",n.resolution); rb.setAttribute("dir","auto"); rs.appendChild(rb); d.appendChild(rs); }

    var th=el("div","d-sec"); th.appendChild(el("div","lbl","Thread"));
    var reps=commentsOf(r,n.id);
    if(!reps.length) th.appendChild(el("div","d-quote","no replies yet"));
    reps.forEach(function(c){ var rp=el("div","reply"); var b=el("b",null,(c.author||"?")+": "); rp.appendChild(b);
      var sp=el("span"); sp.setAttribute("dir","auto"); sp.textContent=c.body||""; rp.appendChild(sp); th.appendChild(rp); });
    var rr=el("div","replyrow"); var ri=el("input"); ri.placeholder="Reply…"; ri.setAttribute("dir","auto"); rr.appendChild(ri);
    var rb2=el("button","mini primary","Send"); rr.appendChild(rb2); th.appendChild(rr); d.appendChild(th);
    function sendReply(){ var v=ri.value.trim(); if(!v) return; ri.value="";
      postComment(r.board,n.id,v).then(function(){ toast("Sent"); load(); }).catch(function(e){ toast("Failed: "+e.message); }); }
    rb2.addEventListener("click",sendReply); ri.addEventListener("keydown",function(e){ if(e.key==="Enter") sendReply(); });

    var acts=el("div","d-actions");
    function act(label, cls, fn){ var b=el("button","mini "+cls,label); b.addEventListener("click",fn); acts.appendChild(b); }
    function doPatch(body, msg){ patch(r.board,n.id,body).then(function(){ toast(msg||"Saved"); load(); }).catch(function(e){ toast("Failed: "+e.message); }); }

    if(tab==="under"){
      act("🔧 Fix","warn",function(){
        var instr=window.prompt("Instruction for Claude (optional — empty just queues it):","");
        if(instr===null) return;
        doPatch({disposition:"fix", owner_note:instr.trim()||null},"Queued for Claude");
      });
      act("⏸ Park","",function(){ doPatch({disposition:"parked"},"Parked"); });
    } else if(tab==="scheduled" || tab==="flagged"){
      act("✎ Edit instruction","warn",function(){
        var instr=window.prompt("Instruction for Claude:", n.owner_note||"");
        if(instr===null) return;
        doPatch({owner_note:instr.trim()||null},"Instruction updated");
      });
      act("↩ Unqueue","",function(){ doPatch({disposition:null, flag_reason:null},"Back to Under review"); });
      act("⏸ Park","",function(){ doPatch({disposition:"parked", flag_reason:null},"Parked"); });
    } else if(tab==="built"){
      act("✓ Approve","ok",function(){
        postComment(r.board,n.id,"✓ Approved by Yonatan").then(function(){ toast("Approved ✓"); load(); }).catch(function(e){ toast("Failed: "+e.message); });
      });
      act("🚩 Flag","danger",function(){
        var reason=window.prompt("What's wrong? (required — Claude retries with this)","");
        if(reason===null || !reason.trim()) return;
        doPatch({status:"open", disposition:"fix", flag_reason:reason.trim(), resolution:null},"Flagged — re-queued for Claude");
      });
      act("↺ Reopen","",function(){ doPatch({status:"open", resolution:null},"Reopened"); });
    } else if(tab==="parked"){
      act("▶ Unpark","",function(){ doPatch({disposition:null},"Back to Under review"); });
      act("🔧 Fix now","warn",function(){
        var instr=window.prompt("Instruction for Claude (optional):","");
        if(instr===null) return;
        doPatch({disposition:"fix", owner_note:instr.trim()||null},"Queued for Claude");
      });
    }
    d.appendChild(acts);
  }

  function render(){ renderTabs(); renderList(); renderDrawer(); }

  /* ---------- load + live polling ---------- */
  var loading=false;
  function load(){
    if(loading) return; loading=true;
    var list=boards();
    if(!list.length){ ALL=[]; render(); loading=false; return; }
    Promise.all(list.map(fetchBoard)).then(function(res){ ALL=res; render(); loading=false; $("#liveTxt").textContent="live"; })
      .catch(function(){ loading=false; $("#liveTxt").textContent="retry…"; });
  }
  $("#refreshBtn").addEventListener("click",load);
  $("#addBtn").addEventListener("click",function(){
    var v=norm($("#addInput").value);
    if(!v||v.indexOf(".")<0){ toast("Enter a domain, e.g. site.com"); return; }
    var b=boards(); if(b.indexOf(v)<0){ b.push(v); saveBoards(b); }
    $("#addInput").value=""; load();
  });
  $("#addInput").addEventListener("keydown",function(e){ if(e.key==="Enter") $("#addBtn").click(); });
  window.addEventListener("focus",load);
  setInterval(function(){ if(!document.hidden) load(); }, 12000);   // the live loop — no manual refresh
  load();
  loadDeliv();
})();
</script>
</body>
</html>
